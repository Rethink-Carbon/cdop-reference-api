# Supabase CLI config: `supabase start` gives a local stack with the same migrations.
project_id = "cdop-reference-api"

[api]
enabled = true
port = 54421
schemas = ["public", "cdop"]
extra_search_path = ["public", "cdop"]
max_rows = 1000

[db]
port = 54422
shadow_port = 54420
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54423

[analytics]
enabled = false

[edge_runtime]
enabled = false

[storage]
enabled = false

[auth]
enabled = false
