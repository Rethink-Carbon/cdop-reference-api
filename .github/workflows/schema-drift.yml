name: Upstream CDOP schema drift

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: drift
        run: |
          set +e
          pnpm --filter @cdop/schemas drift main --fail-on-drift > drift.json
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Open or update the drift issue
        if: steps.drift.outputs.code == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = '```json\n' + fs.readFileSync('drift.json', 'utf8') + '\n```\nRun `pnpm cdop:sync --ref <sha>` in a PR to re-vendor.';
            const title = 'Upstream CDOP schema drift detected';
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'schema-drift' });
            if (issues.length) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issues[0].number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['schema-drift'] });
            }
      # Round 2 draft pods follow the upstream test branch they were published on (ADR 0013).
      # A deleted branch exits 1 and opens nothing: the pin keeps the commit.
      - id: drift-round2
        run: |
          set +e
          pnpm --filter @cdop/schemas drift --round2 --fail-on-drift > drift-round2.json
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Open or update the Round 2 drift issue
        if: steps.drift-round2.outputs.code == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = '```json\n' + fs.readFileSync('drift-round2.json', 'utf8') + '\n```\nRun `pnpm cdop:sync --round2 --ref <sha>` in a PR to re-vendor the Round 2 drafts.';
            const title = 'Upstream Round 2 draft pods changed';
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'schema-drift-round2' });
            if (issues.length) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issues[0].number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['schema-drift-round2'] });
            }
