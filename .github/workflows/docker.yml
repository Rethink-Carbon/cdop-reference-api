name: Publish image

# Called by ci.yml once its checks pass, so only tested commits reach GHCR and Dokploy.
on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trigger Dokploy redeploy
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        # The empty-secret check lives in the script, not in `if:`, so it does not depend on
        # which env scopes `if:` can see and the secret stays scoped to this one step.
        run: |
          if [ -z "$DOKPLOY_DEPLOY_WEBHOOK" ]; then
            echo "DOKPLOY_DEPLOY_WEBHOOK is not set; skipping the Dokploy redeploy."
            exit 0
          fi
          curl -fsS -X POST "$DOKPLOY_DEPLOY_WEBHOOK"
