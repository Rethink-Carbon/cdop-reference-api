<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CDOP Atlas</title>
    <meta
      name="description"
      content="Projects and registry accounts from the CDOP reference API on a map, with status histories, issuances, units, documents and charts."
    />
    <link rel="icon" href="/favicon.ico" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon-192.png" />
    <!-- mapbox -->
    <link rel="stylesheet" href="/atlas/atlas.css" />
    <script type="module" src="/atlas/atlas.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#panel">Skip to results</a>
    <header class="topbar">
      <a class="brand" href="#/">
        <img
          class="logo-light"
          src="/atlas/rethink-logo-black.svg"
          alt="Rethink Carbon"
          width="101"
          height="20"
        />
        <img
          class="logo-dark"
          src="/atlas/rethink-logo-white.svg"
          alt="Rethink Carbon"
          width="101"
          height="20"
        />
        <span class="brand-name">CDOP Atlas</span>
      </a>
      <span class="badge" title="Every project, account and unit here is generated by the seed">
        Synthetic data
      </span>
      <nav class="toplinks" aria-label="Other views of this API">
        <a href="/docs/">API reference</a>
        <a href="/explorer">HAL Explorer</a>
        <a href="/v2">/v2</a>
      </nav>
    </header>

    <form class="filters" id="filters" role="search" aria-label="Filter projects and accounts">
      <label>
        <span>Standard</span>
        <select name="standard">
          <option value="">All standards</option>
        </select>
      </label>
      <label>
        <span>Project stage</span>
        <select name="stage">
          <option value="">All stages</option>
        </select>
      </label>
      <label>
        <span>Country</span>
        <select name="country">
          <option value="">All countries</option>
        </select>
      </label>
      <label class="grow">
        <span>Search</span>
        <input
          name="q"
          type="search"
          placeholder="Project, country or registry ID"
          autocomplete="off"
        />
      </label>
      <button type="reset" class="ghost" disabled>Clear filters</button>
    </form>

    <div class="workspace-bar">
      <div id="view-nav"></div>
      <div class="view-controls" role="group" aria-label="Layout">
        <button type="button" id="fit-map" hidden>Fit results</button>
        <button type="button" id="toggle-map" aria-pressed="false" hidden>Expand details</button>
      </div>
    </div>
    <div class="filter-summary">
      <span id="result-count" role="status">Loading projects and accounts…</span>
      <div id="active-filters" aria-label="Active filters"></div>
    </div>
    <main class="layout">
      <section class="map-wrap" aria-label="Map">
        <div id="map" class="map"></div>
        <div id="map-legend" class="map-legend" aria-live="polite"></div>
      </section>
      <section
        class="panel"
        id="panel"
        tabindex="-1"
        aria-label="Explorer results"
        aria-busy="true"
      >
        <p class="loading">Loading the API root…</p>
      </section>
    </main>

    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  </body>
</html>
